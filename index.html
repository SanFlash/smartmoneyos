if(tab==='Transactions')html=heading('Transactions','Every payment, platform and purpose — in one searchable ledger.','<button class="btn primary" id="addTxPage">＋ Add</button>')+'<section class="panel"><div class="toolbar"><input class="field" id="q" placeholder="Search platform, category or purpose…" value="'+esc(query)+'"><select class="field" id="filter"><option value="all">All types</option>'+['expense','income','investment','saving','transfer'].map(x=>'<option value="'+x+'" '+(filter===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn ghost" id="csv">↓ Export CSV</button></div><div id="table">'+txTable(data.tx)+'</div></section>';
if(tab==='Budgets')html=heading('Monthly budgets','Set category limits and keep spending intentional.','<button class="btn primary" id="addBudget">＋ Create budget</button>')+'<div class="cards">'+(data.budgets.length?data.budgets.map(b=>{let spent=sum('expense',data.tx.filter(x=>x.occurred_on.startsWith(month())&&x.category===b.category)),pct=Math.min(100,spent/b.monthly_limit*100);return '<section class="panel card"><h3>'+esc(b.category)+'</h3><div class="big">'+money(spent)+' <small>/ '+money(b.monthly_limit)+'</small></div><div class="track"><div class="fill" style="width:'+pct+'%;background:'+(pct>90?'#e87878':'')+'"></div></div><div class="foot"><span>'+Math.round(pct)+'% used</span><b>'+money(Math.max(0,b.monthly_limit-spent))+' left</b></div><button class="danger" data-delete-budget="'+b.id+'">Delete budget</button></section>'}).join(''):'<section class="panel empty">No budgets yet. Create your first category limit.<br><button class="btn primary" id="addBudgetEmpty">Create budget</button></section>')+'</div>';
if(tab==='Savings goals')html=heading('Savings goals','Turn milestones into measurable plans.','<button class="btn primary" id="addGoal">＋ New goal</button>')+'<div class="cards">'+(data.goals.length?data.goals.map(g=>{let pct=Math.min(100,g.current_amount/g.target_amount*100);return '<section class="panel card"><h3>◎ '+esc(g.name)+'</h3><div class="big">'+money(g.current_amount)+' <small>of '+money(g.target_amount)+'</small></div><div class="track"><div class="fill" style="width:'+pct+'%;background:#a58cf8"></div></div><div class="foot"><span>'+Math.round(pct)+'% complete</span><b>'+money(Math.max(0,g.target_amount-g.current_amount))+' to go</b></div>'+(g.target_date?'<div class="muted">Target '+esc(g.target_date)+'</div>':'')+'<div class="toolbar" style="margin-top:12px"><button class="btn ghost" data-contribute="'+g.id+'">＋ Add contribution</button><button class="btn ghost" data-delete-goal="'+g.id+'">Delete</button></div></section>'}).join(''):'<section class="panel empty">Create an emergency fund or a goal for a planned purchase.<br><button class="btn primary" id="addGoalEmpty">Create savings goal</button></section>')+'</div>';
if(tab==='Settings')html=heading('Settings & data','Your financial records stay in this browser on this device.')+'<div class="grid"><section class="panel"><h2>Local database</h2><p class="muted">IndexedDB · SmartMoneyOS · No cloud sync or third-party database. Your records are not sent to a server.</p><p class="muted">Transactions: '+data.tx.length+' · Budgets: '+data.budgets.length+' · Goals: '+data.goals.length+'</p><button class="btn ghost" id="backup">Export full backup (JSON)</button> <button class="btn ghost" id="restore">Import backup</button><input class="hide" type="file" id="backupFile" accept="application/json"></section><section class="panel"><h2>Currency & tracking</h2><p class="muted">Indian Rupee (INR). Manual entry only. No bank connection, payment initiation, or credential collection.</p><p class="muted">For safety, export a backup before clearing browser data or changing devices.</p><button class="btn ghost" id="csvSettings">Export transactions (CSV)</button></section></div><section class="panel" style="margin-top:14px"><h2>Danger zone</h2><p class="muted">Permanently delete all SmartMoney OS data stored in this browser. This cannot be undone.</p><button class="btn ghost" id="wipe">Delete all local data</button></section>';
p.innerHTML=html;
if(tab==='Overview'){$('#reviewBudgets').onclick=()=>go('Salary planner');}
if(tab==='Salary planner'){$('#editSalaryPlan').onclick=editSalaryPlan;$('#editSalaryPlan2').onclick=editSalaryPlan;$('#recordSaving').onclick=()=>{addTx();const saveBtn=$('#tx [data-t="saving"]');if(saveBtn)saveBtn.click()}}
if(tab==='Transactions'){$('#addTxPage').onclick=addTx;$('#csv').onclick=csv;$('#q').oninput=e=>{query=e.target.value;renderTxTable()};$('#filter').onchange=e=>{filter=e.target.value;renderTxTable()}}
if(tab==='Budgets'){const b=$('#addBudget')||$('#addBudgetEmpty');if(b)b.onclick=addBudget}
if(tab==='Savings goals'){const b=$('#addGoal')||$('#addGoalEmpty');if(b)b.onclick=addGoal}
document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>delTx(b.dataset.deleteTx));document.querySelectorAll('[data-delete-budget]').forEach(b=>b.onclick=()=>delBudget(b.dataset.deleteBudget));document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>delGoal(b.dataset.deleteGoal));document.querySelectorAll('[data-contribute]').forEach(b=>b.onclick=()=>contribute(b.dataset.contribute));
if(tab==='Settings'){$('#backup').onclick=backup;$('#restore').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=restore;$('#csvSettings').onclick=csv;$('#wipe').onclick=wipe}}
function renderTxTable(){const el=$('#table');if(el)el.innerHTML=txTable(data.tx.filter(x=>(filter==='all'||x.type===filter)&&JSON.stringify(x).toLowerCase().includes(query.toLowerCase())))}
function modal(title,body){$('#modal').innerHTML='<div class="modalbg" id="modalbg"><div class="modal"><div class="eyebrow">SMARTMONEY OS · LOCAL DATABASE</div><h2>'+title+'</h2>'+body+'</div></div>';$('#modalbg').onclick=e=>{if(e.target.id==='modalbg')closeModal()}}
function closeModal(){$('#modal').innerHTML=''}
function addTx(){let type='expense';modal('Record a transaction','<form class="form" id="tx"><div class="types">'+Object.keys(cats).map(t=>'<button type="button" class="'+(t===type?'sel':'')+'" data-t="'+t+'">'+t+'</button>').join('')+'</div><label>Amount (₹)<input class="field" name="amount" type="number" min=".01" step=".01" required></label><label>Description<input class="field" name="title" maxlength="100" required placeholder="e.g. Monthly SIP payment"></label><div class="two"><label>Category<select class="field" name="category">'+cats[type].map(c=>'<option>'+c+'</option>').join('')+'</select></label><label>Platform / merchant<input class="field" name="platform" maxlength="100" placeholder="Groww, Amazon, Swiggy"></label></div><label>Purpose / why are you paying?<input class="field" name="purpose" maxlength="180" placeholder="Monthly investment, groceries…"></label><div class="two"><label>Payment method<select class="field" name="payment_method">'+['UPI','Debit card','Credit card','Net banking','Cash','Bank transfer','Wallet','Other'].map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Account / wallet<input class="field" name="account_name" maxlength="80" value="Primary bank"></label></div><div class="two"><label>Date<input class="field" name="occurred_on" type="date" value="'+today()+'" required></label><label>Recurring<select class="field" name="recurring"><option value="false">No</option><option value="true">Yes</option></select></label></div><label>Notes<textarea class="field" name="notes" rows="2" maxlength="500"></textarea></label><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn primary">Save transaction →</button></div></form>');$('#cancel').onclick=closeModal;$('#tx').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{type=b.dataset.t;$('#tx').querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('sel',x===b));$('#tx [name=category]').innerHTML=cats[type].map(c=>'<option>'+c+'</option>').join('')});$('#tx').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return toast('Enter an amount greater than zero.');await put('transactions',{id:uid(),title:f.get('title').trim(),amount,type,category:f.get('category'),platform:f.get('platform').trim(),purpose:f.get('purpose').trim(),payment_method:f.get('payment_method'),account_name:f.get('account_name').trim(),occurred_on:f.get('occurred_on'),recurring:f.get('recurring')==='true',notes:f.get('notes').trim(),created_at:Date.now()});closeModal();await refresh();toast('Transaction saved on this device.')}}
function editSalaryPlan(){
const w=data.plan.weights||{};
modal('Configure your salary plan','<form class="form" id="salaryPlan"><div class="two"><label>Monthly take-home salary (₹)<input class="field" name="salary" type="number" min="1" step="1" value="'+Number(data.plan.salary)+'" required></label><label>Monthly savings target (₹)<input class="field" name="savingsTarget" type="number" min="9001" step="1" value="'+Number(data.plan.savingsTarget)+'" required></label></div><p class="muted">Savings target must be above ₹9,000. Income transactions entered this month override configured salary for this month.</p><h3>Expense allocation percentages</h3><p class="muted">Percentages must add up to exactly 100%. They divide the amount left after protected savings.</p><div class="two">'+Object.entries(w).map(([cat,pct])=>'<label>'+esc(cat)+' (%)<input class="field" type="number" name="weight_'+esc(cat)+'" min="0" max="100" step=".1" value="'+Number(pct)+'" required></label>').join('')+'</div><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn primary">Save salary plan</button></div></form>');
$('#cancel').onclick=closeModal;
$('#salaryPlan').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),salary=Number(f.get('salary')),savingsTarget=Number(f.get('savingsTarget')),weights={};for(const cat of Object.keys(w))weights[cat]=Number(f.get('weight_'+cat));const total=Object.values(weights).reduce((a,b)=>a+b,0);if(salary<=0||savingsTarget<=9000)return toast('Enter a valid salary and savings target above ₹9,000.');if(Object.values(weights).some(v=>!Number.isFinite(v)||v<0)||Math.abs(total-100)>.01)return toast('Category percentages must total exactly 100%.');data.plan={salary,savingsTarget,weights};await put('settings',{key:'salaryPlan',value:data.plan});closeModal();await refresh();toast('Salary-first expense plan saved.')};
}
function addBudget(){modal('Set a monthly budget','<form class="form" id="budget"><label>Expense category<select class="field" name="category">'+cats.expense.map(x=>'<option>'+x+'</option>').join('')+'</select></label><label>Monthly limit (₹)<input class="field" name="monthly_limit" type="number" min="1" step=".01" value="5000" required></label><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn primary">Save budget</button></div></form>');$('#cancel').onclick=closeModal;$('#budget').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),limit=Number(f.get('monthly_limit')),category=f.get('category'),old=data.budgets.find(x=>x.category===category);if(limit<=0)return toast('Budget must be greater than zero.');await put('budgets',{id:old?.id||uid(),category,monthly_limit:limit,month:month()});closeModal();await refresh();toast('Budget saved.')}}
function addGoal(){modal('Create a savings goal','<form class="form" id="goal"><label>Goal name<input class="field" name="name" maxlength="100" required value="Emergency fund"></label><div class="two"><label>Target amount (₹)<input class="field" name="target_amount" type="number" min="1" step=".01" value="50000" required></label><label>Already saved (₹)<input class="field" name="current_amount" type="number" min="0" step=".01" value="0"></label></div><label>Target date<input class="field" name="target_date" type="date"></label><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn primary">Create goal</button></div></form>');$('#cancel').onclick=closeModal;$('#goal').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),target=Number(f.get('target_amount')),current=Number(f.get('current_amount'));if(target<=0||current<0)return toast('Enter valid goal amounts.');await put('goals',{id:uid(),name:f.get('name').trim(),target_amount:target,current_amount:current,target_date:f.get('target_date')||'',created_at:Date.now()});closeModal();await refresh();toast('Savings goal created.')}}
async function contribute(id){let g=data.goals.find(x=>x.id===id);if(!g)return;modal('Add to '+esc(g.name),'<form class="form" id="contribution"><div class="muted">Current progress: '+money(g.current_amount)+' of '+money(g.target_amount)+'</div><label>Contribution amount (₹)<input class="field" name="amount" type="number" min=".01" step=".01" required></label><div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button class="btn primary">Add contribution</button></div></form>');$('#cancel').onclick=closeModal;$('#contribution').onsubmit=async e=>{e.preventDefault();let n=Number(new FormData(e.target).get('amount'));if(n<=0)return toast('Enter a valid amount.');await put('goals',{...g,current_amount:Number(g.current_amount)+n});closeModal();await refresh();toast('Goal progress updated.')}}
async function delTx(id){if(!confirm('Delete this transaction permanently?'))return;await del('transactions',id);await refresh();toast('Transaction deleted.')}
async function delBudget(id){if(!confirm('Delete this budget?'))return;await del('budgets',id);await refresh();toast('Budget deleted.')}
async function delGoal(id){if(!confirm('Delete this savings goal?'))return;await del('goals',id);await refresh();toast('Savings goal deleted.')}
function csv(){const rows=[['Date','Description','Type','Category','Platform','Purpose','Payment method','Account','Amount','Recurring','Notes'],...data.tx.map(x=>[x.occurred_on,x.title,x.type,x.category,x.platform||'',x.purpose||'',x.payment_method||'',x.account_name||'',x.amount,x.recurring?'Yes':'No',x.notes||''])],s=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');download('smartmoney-transactions-'+month()+'.csv',new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}))}
function download(name,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function backup(){const payload={app:'SmartMoney OS',formatVersion:1,exportedAt:new Date().toISOString(),currency:'INR',transactions:data.tx,budgets:await all('budgets'),goals:data.goals};download('smartmoney-backup-'+today()+'.json',new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));toast('Backup exported. Store it somewhere safe.')}
async function restore(e){const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!=='SmartMoney OS'||!Array.isArray(x.transactions)||!Array.isArray(x.budgets)||!Array.isArray(x.goals))throw Error('This is not a valid SmartMoney OS backup.');if(!confirm('Import this backup? Existing records with matching IDs will be replaced; other records are retained.'))return;for(const [s,arr] of [['transactions',x.transactions],['budgets',x.budgets],['goals',x.goals]])for(const row of arr)await put(s,row);await refresh();toast('Backup imported successfully.')}catch(err){alert(err.message)}finally{e.target.value=''}}
async function wipe(){if(!confirm('Delete ALL transactions, budgets and savings goals from this browser? Export a backup first if needed.'))return;if(!confirm('Final confirmation: this action cannot be undone.'))return;await Promise.all([clear('transactions'),clear('budgets'),clear('goals')]);await refresh();toast('All local finance data was deleted.')}
(async()=>{try{db=await openDB();shell();await refresh()}catch(e){document.body.innerHTML='<main class="setup"><h1>Local database unavailable</h1><p>'+esc(e.message)+'</p><p>Use a current browser with IndexedDB enabled and avoid private browsing modes that block site storage.</p></main>'}})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
